[project]
name = "safety-drift"
version = "0.1.0"
description = "Predicting and preventing safety drift from benign corporate fine-tuning (Qwen3.5 / Qwen3.8)"
requires-python = ">=3.12,<3.13"
# Training + activation env (5090 / WSL). Versions pinned to the stack already
# proven on this machine for Qwen3.8-27B QLoRA (~/train-venv, 2026-09).
dependencies = [
    "torch==2.14.0",
    "transformers==5.16.1",
    "peft==0.20.0",
    "trl==1.12.0",
    "accelerate==1.14.0",
    "bitsandbytes==0.50.2",
    "flash-linear-attention==0.5.2",
    "causal-conv1d==1.7.0",
    "datasets==5.0.1",
    "huggingface-hub[cli]",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "statsmodels",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safety_drift"]
